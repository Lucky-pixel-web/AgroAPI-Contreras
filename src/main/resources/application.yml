
server:
  port: 8080

spring:
  application:
    name: AgroAPI-Contreras

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${DB_USER:AGRODB}
    password: ${DB_PASSWORD:123}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
agro:
  jwt:
    issuer: AgroAPI-Contreras
    secret-base64: ${JWT_SECRET_BASE64}